# fly.toml app configuration file generated for oroute on 2026-03-20T09:12:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omniroute'
primary_region = 'syd'

[build]
  # Fly's shared remote builders have less RAM than the 16GB GitHub Actions
  # runners this Dockerfile's defaults are tuned for (see Dockerfile's
  # OMNIROUTE_BUILD_WORKERS comment + tests/unit/docker-build-memory-budget.test.ts).
  # 2 parallel page-data workers (the repo default) needs ~9GB peak RSS and
  # OOM-killed the build on a smaller Fly builder with no visible error beyond
  # "did not complete successfully: exit code: 1" right after "Creating an
  # optimized production build...". Forcing a single worker here (Fly-specific,
  # does not change the Dockerfile's own default used by CI) trades build time
  # for a peak of ~4.5GB, which fits.
  [build.args]
    OMNIROUTE_BUILD_WORKERS = '1'

[processes]
  # The Dockerfile's own CMD is `node dev/run-standalone.mjs` (assembleStandalone.mjs
  # copies scripts/dev/run-standalone.mjs to <standalone>/dev/run-standalone.mjs).
  # Fly's [processes] entry overrides the container's default CMD, so it must match
  # that path exactly — this previously pointed at the repo-root filename, which
  # doesn't exist in the image, and crashed every machine with "Cannot find module
  # '/app/run-standalone.mjs'" in a restart loop until Fly gave up after 10 tries.
  app = 'node dev/run-standalone.mjs'

[deploy]
#  release_command = "node ./dbsetup.js"

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  TZ = "Asia/Shanghai"

  # Bind to all interfaces for Fly runtime networking.
  HOST = "0.0.0.0"
  HOSTNAME = "0.0.0.0"
  BIND = "0.0.0.0"

  # The Dockerfile bakes DATA_DIR=/app/data for docker-compose's volume mount.
  # Fly's own persistent volume (see [[mounts]] above) is mounted at /data, so
  # this override is required or the SQLite DB/settings live on the ephemeral
  # container filesystem and are lost on every restart or redeploy.
  DATA_DIR = "/data"
