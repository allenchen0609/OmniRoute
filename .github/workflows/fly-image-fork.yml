name: Build Fly.io image (fork)

# Fork-specific escape hatch: the repo's official docker-publish.yml pushes to
# the upstream owner's Docker Hub/GHCR namespace and needs DOCKERHUB_* secrets
# this fork doesn't have. This workflow builds the same runner-base target on
# GitHub's own 16GB hosted runners (the machine this Dockerfile's memory
# defaults are already tuned for) and pushes to this fork's own GHCR
# namespace using only the automatically-provided GITHUB_TOKEN, so Fly.io (or
# any host) can run a pre-built image instead of building it on a smaller
# remote builder that OOMs on this codebase's Next.js production build.
#
# Manual trigger only (workflow_dispatch): this is a one-off deploy aid, not
# part of the regular CI/release pipeline.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner-base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          # Webpack, not Turbopack: the official docker-publish.yml already
          # disables Turbopack for Docker builds (see its own comment on a
          # TurbopackInternalError after 26 minutes on a large runner) — the
          # Dockerfile's ARG default only stays on Turbopack for local/npm
          # builds, not container builds.
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute:latest
